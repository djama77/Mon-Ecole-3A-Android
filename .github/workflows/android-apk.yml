name: Android APK hors ligne
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android présent sur le runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || exit 1
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Vérifier les sept PDF
        run: |
          for f in francais mathematiques arabe anglais sciences emci histoire_geographie; do
            test -s "www/guides/$f.pdf" || { echo "::error::Guide manquant: www/guides/$f.pdf"; exit 1; }
          done
      - name: Install dependencies
        run: npm install
      - name: Prepare offline assets
        run: npm run prepare:web
      - name: Create Android project
        run: npx cap add android
      - name: Install native offline OCR and sync
        run: npm run android:sync
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Mon_Ecole_3A_V3_Android_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk